<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="260" viewBox="0 0 1800 260" role="img" aria-labelledby="title desc">
  <title id="title">LOKESH PARGAIN AI ENGINEER</title>
  <desc id="desc">A horizontal dark green pixel-inspired banner for a software and AI engineer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b13"/>
      <stop offset="1" stop-color="#102d20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" rx="2" fill="#86efac" opacity=".09"/>
    </pattern>
  </defs>
  <rect width="1800" height="260" rx="28" fill="url(#bg)"/>
  <rect x="18" y="18" width="1764" height="224" rx="20" fill="url(#grid)" stroke="#4ade80" stroke-opacity=".24"/>
  <g fill="#22c55e" opacity=".9">
    <rect x="58" y="54" width="14" height="14"/><rect x="80" y="76" width="14" height="14"/><rect x="58" y="98" width="14" height="14"/>
    <rect x="1728" y="148" width="14" height="14"/><rect x="1706" y="170" width="14" height="14"/><rect x="1728" y="192" width="14" height="14"/>
  </g>
  <text x="900" y="116" text-anchor="middle" fill="#f0fdf4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="74" font-weight="800" letter-spacing="4">LOKESH PARGAIN</text>
  <rect x="560" y="142" width="680" height="3" rx="2" fill="url(#accent)" opacity=".9"/>
  <text x="900" y="198" text-anchor="middle" fill="#86efac" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700" letter-spacing="13">AI ENGINEER</text>
</svg>